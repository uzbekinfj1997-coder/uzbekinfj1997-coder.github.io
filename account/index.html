<title>My account · Sora</title>
<script>
/* Several apps share this web address: each keeps what it saves (scores, players, theme) apart, under its own name. What was saved
   before they were kept apart is copied into each app once. SoraApp.keys() lists this app's own keys, for the backup file. */
(() => {
  const ns = "public:", store = localStorage, p = Storage.prototype, get = p.getItem, set = p.setItem, remove = p.removeItem;
  const raw = () => Array.from({ length: store.length }, (_, i) => store.key(i));
  if (get.call(store, ns + "since") === null) {
    for (const k of raw()) if (!/^[a-z0-9-]+:/.test(k)) { try { set.call(store, ns + k, get.call(store, k)); } catch { /* full */ } }
    try { set.call(store, ns + "since", String(Date.now())); } catch { /* full */ }
  }
  p.getItem = function (k) { return get.call(this, this === store ? ns + k : k); };
  p.setItem = function (k, v) { return set.call(this, this === store ? ns + k : k, v); };
  p.removeItem = function (k) { return remove.call(this, this === store ? ns + k : k); };
  window.SoraApp = { id: "public", keys: () => raw().filter((k) => k.startsWith(ns) && k !== ns + "since").map((k) => k.slice(ns.length)) };
})();
</script>

<style>
  /* My account (static/account/app.js): the coins big, the subjects to go back to, the results, the medals and cups */
  .ac { display: grid; gap: var(--space-4); }
  .ac-topbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: var(--space-3); }
  #acStatus { font-size: 13px; color: var(--ink-muted); }
  #acMain { display: grid; gap: var(--space-6); }
  .ac-hero { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: var(--space-4); padding: var(--space-6);
    background: linear-gradient(135deg, color-mix(in srgb, #ffc83d 14%, var(--bg-200)), var(--bg-200)); border: 2px solid color-mix(in srgb, #ffc83d 45%, var(--line)); border-radius: 18px; }
  .ac-hero > div { display: grid; gap: 6px; align-content: start; justify-items: start; }
  .ac-hero small { color: var(--ink-muted); font-size: 13px; }
  .ac-tier b { font-family: var(--font-display); font-size: 26px; text-transform: uppercase; }
  .ac-link { color: #e6a800; font-weight: 700; text-decoration: none; }
  .ac-bar-in { display: block; width: 100%; height: 8px; background: var(--bg-100); border-radius: 4px; overflow: hidden; }
  .ac-bar-in i { display: block; height: 100%; background: linear-gradient(90deg, #ffb300, #ffd84d); }
  .ac-sec h2 { margin: 0 0 var(--space-3); font-family: var(--font-display); font-size: 20px; text-transform: uppercase; letter-spacing: .04em; }
  .ac-sec h3 { margin: var(--space-4) 0 var(--space-2); font-family: var(--font-display); text-transform: uppercase; }
  .ac-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: var(--space-3); }
  .ac-subject { display: grid; gap: 8px; justify-items: start; padding: var(--space-4); background: var(--bg-200); border: 1px solid var(--line); border-top: 3px solid #ffc83d;
    color: inherit; text-decoration: none; }
  .ac-subject:hover { background: var(--bg-300); }
  .ac-subject b { font-family: var(--font-display); font-size: 18px; text-transform: uppercase; }
  .ac-subject small { color: var(--ink-muted); }
  .ac-go { font-weight: 800; color: var(--volt-text, var(--volt)); text-transform: uppercase; font-size: 13px; }
  .ac-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: var(--space-3); }
  .ac-tile { display: grid; gap: 2px; padding: var(--space-3) var(--space-4); background: var(--bg-200); border-left: 3px solid var(--line); }
  .ac-tile b { font-family: var(--font-mono); font-size: 26px; }
  .ac-tile span { font-size: 13px; }
  .ac-tile small { color: var(--ink-muted); font-size: 12px; }
  .ac-latest summary { cursor: pointer; color: var(--ink-muted); margin-top: var(--space-3); }
  .ac-latest ul { margin: var(--space-2) 0 0; padding: 0; list-style: none; display: grid; gap: 4px; }
  .ac-latest li { display: flex; justify-content: space-between; gap: var(--space-3); padding: 4px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .ac-latest li b { font-family: var(--font-mono); color: #3fbf73; }
  .ac-medals { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: var(--space-3); }
  .ac-medal, .ac-cup { display: grid; gap: 6px; justify-items: start; padding: var(--space-4); background: var(--bg-200); border: 1px solid var(--line); border-radius: 14px; }
  .ac-medal.lv0, .ac-cup:not(.won) { opacity: .78; }
  .ac-medal.lv0 .ac-medal-ico, .ac-cup:not(.won) .ac-medal-ico { filter: grayscale(1); }
  .ac-medal.lv1 { border-color: #c47a3a; } .ac-medal.lv2 { border-color: #b8c2cc; } .ac-medal.lv3 { border-color: #ffc83d; box-shadow: 0 0 0 3px rgba(255, 200, 61, .15); }
  .ac-cup.won { border-color: #ffc83d; background: linear-gradient(135deg, color-mix(in srgb, #ffc83d 14%, var(--bg-200)), var(--bg-200)); }
  .ac-medal-ico { font-size: 40px; line-height: 1; }
  .ac-medal b, .ac-cup b { font-family: var(--font-display); font-size: 16px; text-transform: uppercase; }
  .ac-medal small, .ac-cup small { color: var(--ink-muted); }
  .ac-levels { display: flex; gap: 8px; }
  .ac-level { display: grid; justify-items: center; font-size: 22px; filter: grayscale(1); opacity: .45; }
  .ac-level.on { filter: none; opacity: 1; }
  .ac-level small { font-size: 11px; font-family: var(--font-mono); }
  .ac-next { display: grid; gap: 4px; width: 100%; }
  .ac-done { color: #e6a800 !important; font-weight: 700; }
  .ac-form { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-3); }
  .ac-form input { flex: 1 1 260px; min-height: 40px; font-family: var(--font-mono); }
  .ac-code { display: block; margin-top: var(--space-2); padding: var(--space-2) var(--space-3); background: var(--bg-100); font-family: var(--font-mono); word-break: break-all; }
</style>

<script>
/* Several apps share this web address: each keeps what it saves (scores, players, theme) apart, under its own name. What was saved
   before they were kept apart is copied into each app once. SoraApp.keys() lists this app's own keys, for the backup file. */
(() => {
  const ns = "robiyaxon:", store = localStorage, p = Storage.prototype, get = p.getItem, set = p.setItem, remove = p.removeItem;
  const raw = () => Array.from({ length: store.length }, (_, i) => store.key(i));
  if (get.call(store, ns + "since") === null) {
    for (const k of raw()) if (!/^[a-z0-9-]+:/.test(k)) { try { set.call(store, ns + k, get.call(store, k)); } catch { /* full */ } }
    try { set.call(store, ns + "since", String(Date.now())); } catch { /* full */ }
  }
  p.getItem = function (k) { return get.call(this, this === store ? ns + k : k); };
  p.setItem = function (k, v) { return set.call(this, this === store ? ns + k : k, v); };
  p.removeItem = function (k) { return remove.call(this, this === store ? ns + k : k); };
  window.SoraApp = { id: "robiyaxon", keys: () => raw().filter((k) => k.startsWith(ns) && k !== ns + "since").map((k) => k.slice(ns.length)) };
})();
</script>

<script>
(() => {
  const SC = window.SoraCoins, o = SC.playing(), books = window.StudyBooks || [], fmt = SC.fmt;
  let toWin = 0, today = 0;
  for (const card of document.querySelectorAll(".tool-card[data-book]")) {
    const id = card.dataset.book, b = books.find((x) => x.id === id), sum = b ? SC.bookSummary(b, SC.progressOf(b), o) : SC.studies()[id];
    if (!sum) continue;
    if (b) SC.noteBook(id, sum);
    toWin += sum.total; today += sum.today;
    card.querySelector(".open").before(el("span", { class: "home-pot" }, el("span", { class: "coin-pot" }, `🪙 ${fmt(sum.total)}`),
      sum.today ? el("span", { class: "coin-tag hot" }, tr("today 🪙 {n}", { n: fmt(sum.today) })) : ""));
  }
  const s = SC.state(), t = SC.tierOf(s.earned);
  document.getElementById("homeCoins").replaceChildren(el("a", { class: "home-coins", href: window.SORA_ACCOUNT_PAGE },
    el("span", { class: "coin-pot big" }, `🪙 ${fmt(s.balance)}`),
    el("span", {}, el("b", {}, tr("Your coins")), el("small", {}, `${t.icon} ${tr(t.name)}`)),
    toWin ? el("span", {}, el("b", {}, tr("🪙 {n} still to win", { n: fmt(toWin) })), el("small", {}, today ? tr("today 🪙 {n}", { n: fmt(today) }) : tr("in your subjects"))) : "",
    el("span", { class: "go" }, tr("My account ▶"))));
})();
</script>
